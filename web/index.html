<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrainRadar</title>
  <meta name="description" content="Live map of Renfe Cercanías and Rodalies trains from Renfe open data">
  <!-- Apply a saved theme choice before first paint so the page does not flash. -->
  <script>try { const t = localStorage.getItem("trainradar-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="preload" href="https://brokkr.noprettycolors.com/fonts/noto-sans/2.015/NotoSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://brokkr.noprettycolors.com/v/1.0.3/brokkr.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1 class="brand">TrainRadar <span class="sub">Cercanías · Rodalies</span></h1>
    <label class="field">
      <span class="sr">Network</span>
      <select id="nucleo"><option value="">All of Spain</option></select>
    </label>
    <label class="field">
      <span class="sr">Line</span>
      <select id="line"><option value="">All lines</option></select>
    </label>
    <label class="field search">
      <span class="sr">Find a train or station</span>
      <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#npc-icon-search"></use></svg>
      <input id="search" type="search" placeholder="Train no. or station" autocomplete="off" list="search-list">
      <datalist id="search-list"></datalist>
    </label>
    <button id="alerts-btn" class="button" type="button" aria-expanded="false">
      <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#npc-icon-notification"></use></svg>
      Alerts <span id="alerts-count" class="count">0</span>
    </button>
    <div id="fresh" class="fresh" role="status" aria-live="polite">Connecting…</div>
    <button id="theme-btn" class="icon-button" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#npc-icon-dark"></use></svg>
    </button>
  </header>

  <main>
    <div id="map" aria-label="Train map"></div>

    <div class="legend" aria-hidden="true">
      <span><i class="dot positive"></i>On time</span>
      <span><i class="dot caution"></i>1–5 min late</span>
      <span><i class="dot risk"></i>&gt;5 min late</span>
      <span><i class="dot none"></i>No data</span>
    </div>

    <aside id="panel" class="panel" hidden>
      <button id="panel-close" class="icon-button close" type="button" aria-label="Close" title="Close">
        <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#npc-icon-close"></use></svg>
      </button>
      <div id="panel-body"></div>
    </aside>
  </main>

  <footer class="attrib">
    Data: <a href="https://data.renfe.com" target="_blank" rel="noopener">Renfe Open Data</a> (GTFS / GTFS‑RT) · positions are approximate
  </footer>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
