name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q server
      - name: Import the server
        run: python -c "import server.app, server.realtime, server.static_gtfs"
      - name: Check JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done
      - name: No private keys or certificates
        run: |
          if git grep -n -I -E 'BEGIN ([A-Z]+ )?PRIVATE KEY|BEGIN CERTIFICATE' -- . ':!CONTRIBUTING.md' ':!.github/workflows/ci.yml'; then
            echo "::error::Key or certificate material found"; exit 1
          fi
      - name: No secrets in history (gitleaks)
        # The CLI rather than gitleaks-action, which needs a licence for organisation repositories.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
